name: Build OnSpeed Customer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Recreate Android Files
        run: flutter create . --platforms=android --org=com.onspeed.customer

      - name: Add Internet Permission to Android
        run: |
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: OnSpeed Customer App v1.0.3 (PIN Auth & Internet)
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
